<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <!--폼1 - 텍스트-->
        <a>name: </a><br>
        <input type="text" id="fname" name="fname"> <br> <br>

        <!--폼2 - 라디오-->
        <input type="radio" value="Female"> Female<br>
        <input type="radio" value="Male"> Male<br> <br>


        <!--폼3 체크박스-->
        <input type="checkbox" value="yeolsong"> apple <br>
        <input type="checkbox" value="Oragne"> orange <br>
        <input type="checkbox" value="Banana"> banana <br> <br>

        <!--폼4 date-->
        <label for="birthday">Birthday:</label>
        <input type="date" id="birthday" name="birthday"> <br><br>

        <!--폼5 select -->
        <select id="cars" name="cars">
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="fiat">Fiat</option>
            <option value="audi">Audi</option>
        </select> <br><br>

        <!--폼6 textarea-->
        <textarea name="message" rows="10" cols="30">The cat was playing in the garden.
        </textarea> <br>


        <!--폼7 password-->
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd">
        <!--폼8 제출-->
        <input type="submit" value="Submit"><br>

        <!--폼8 color-->
        <label for="favcolor">Select your favorite color:</label>
        <input type="color" id="favcolor" name="favcolor"> <br>


        <!--폼9 image-->
        <input type="image" src="img_submit.gif" alt="Submit" width="48" height="48"> <br>

        <!--폼10 range-->
        <label for="vol">Volume (between 0 and 50):</label>
        <input type="range" id="vol" name="vol" min="0" max="50">

    </form>
</body>

</html>
