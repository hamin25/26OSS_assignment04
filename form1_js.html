<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & User Information</title>

    <style>

        body {
            background-color: #f5f5f5;
            color: #333333;
        }

        form {
            width: 500px;
            margin: 50px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #754646;
            border-radius: 5px;
            background-color: rgb(255, 236, 236);
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        input[type="color"] {
            width: 50%;
            height: 50px;
            margin-bottom: 10px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border: 2px solid #4a90e2;
            outline: none;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            background-color: #33639b;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }

    </style>
</head>


<body>

    <form id="userForm">

        <h1>로그인</h1>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               minlength="6"
               required>

        <label>
            <input type="checkbox" name="remember">
            Remember me
        </label>


        <h1>회원 정보</h1>

        <label for="name">이름</label>
        <input type="text" id="name" name="name" required>

        <p>성별</p>

        <label>
            <input type="radio" name="gender" value="male">
            남성
        </label>

        <label>
            <input type="radio" name="gender" value="female">
            여성
        </label>


        <label for="birth">생년월일</label>
        <input type="date" id="birth" name="birth">


        <label for="grade">학년</label>
        <select id="grade" name="grade">
            <option value="">선택하세요</option>
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
            <option value="4">4학년</option>
        </select>


        <p>관심 분야</p>

        <label>
            <input type="checkbox" name="interest" value="photo">
            사진
        </label>

        <label>
            <input type="checkbox" name="interest" value="music">
            음악
        </label>

        <label>
            <input type="checkbox" name="interest" value="movie">
            영화
        </label>


        <label for="intro">자기소개</label>
        <textarea id="intro" name="intro" rows="5"></textarea>


        <label for="color">좋아하는 색</label>
        <input type="color" id="color" name="color">


        <br>

        <button type="submit">가입하기</button>
        <button type="reset">초기화</button>

    </form>


    <script>

        const form = document.querySelector("#userForm");

        form.addEventListener("submit", function (event) {

            const username = document.querySelector("#username");
            const email = document.querySelector("#email");
            const password = document.querySelector("#password");
            const name = document.querySelector("#name");


            if (!username.checkValidity()) {
                event.preventDefault();
                alert("Username을 입력하세요.");
                username.focus();
                return;
            }


            if (!email.checkValidity()) {
                event.preventDefault();
                alert("유효한 이메일을 입력하세요.");
                email.focus();
                return;
            }


            if (!password.checkValidity()) {
                event.preventDefault();
                alert("비밀번호를 6자 이상 입력하세요.");
                password.focus();
                return;
            }


            if (!name.checkValidity()) {
                event.preventDefault();
                alert("이름을 입력하세요.");
                name.focus();
                return;
            }


            event.preventDefault();
            alert("등록이 완료되었습니다.");

        });

    </script>

</body>

</html>
